experiment:
  name: vggtoda3
  objective_protocol: direct_teacher_distillation_v1
  hypothesis: >-
    Same-clip frozen VGGT-Omega pseudo-labels directly supervise the official
    pretrained DA3-Small depth and camera heads on 16-frame clips.

seed: 42
device: cuda

dataset:
  name: scared
  root: /public/home/2024141520249/Documents/datasets/vggtodistilldata/processed/SCARED
  train_manifest_path: null
  test_manifest_path: null
  frame_source: auto
  clip_length: 16
  sample_stride: 1
  window_stride: 8
  drop_incomplete_clip: true
  image_height: 448
  image_width: 560
  resize_mode: resize
  normalize_mode: zero_one
  highlight:
    enabled: true
    storage: precomputed
    mask_directory_name: student_highlight_mask
    inpainted_directory_name: student_inpainted_rgb
    absolute_threshold: 250.0
    candidate_threshold: 230.0
    relative_threshold: 0.95
    minimum_component_size: 5000
    keep_components: smaller
    dilation_radius: 2
    median_kernel: 31
    inpaint_blur_sigma: 8.0
    decay_window_size: 10
    decay_coefficient: 20.0

teacher:
  variant: base
  cache_protocol: crossclip_local_v1
  pretrained_checkpoint: ./checkpoints/vggt_omega/vggt_omega_1b_512.pt
  raw_cache_root: /public/home/2024141520249/Documents/Projects/vggtofast3r/data/teacher_cache_crossclip_base_raw_448x560
  cache_dtype: float32
  inference_batch_size: 4
  amp: true
  amp_dtype: bfloat16
  cache_compressed: true
  cache_write_workers: 2
  frozen: true
  freeze_backbone: true
  freeze_heads: true
  min_depth: 0.1
  max_depth: 150.0
  minimum_valid_fraction: 0.001

teacher_dataloader:
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4

student:
  architecture: da3_small
  model_name: da3-small
  image_height: 448
  image_width: 560
  patch_size: 14
  checkpoint: ./checkpoints/da3-small/model.safetensors
  config_path: ./checkpoints/da3-small/config.json
  normalize_mode: zero_one
  use_ray: false
  use_ray_pose: false
  use_camera_head: true
  freeze_backbone: true
  use_backbone_lora: true
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.05
  lora_expected_modules: 24
  freeze_depth_head: false
  freeze_camera_encoder: true
  freeze_camera_decoder: false
  head_chunk_size: 8
  ref_view_strategy: saddle_balanced

loss:
  mode: direct_teacher_distillation
  lambda_depth: 1.0
  lambda_camera: 0.1
  camera:
    lambda_rotation: 1.0
    lambda_translation_direction: 1.0
    lambda_translation_magnitude: 1.0
    lambda_intrinsics: 1.0
  lambda_highlight: 0.01
  lambda_smooth: 0.1
  eps: 1.0e-6
  use_confidence_weight: true

dataloader:
  batch_size: 16
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: false

training:
  epochs: 20
  learning_rate: 1.0e-5
  lora_learning_rate: 1.0e-5
  min_learning_rate: 1.0e-6
  weight_decay: 0.05
  warmup_fraction: 0.05
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: auto
  log_every: 10
  save_every: 1
  timing:
    enabled: true
    log_every_micro_batches: 1
  output_dir: ./outputs/vggtoda3_direct
  resume: null

evaluation:
  protocol: vda

vda_evaluation:
  checkpoint: ./outputs/vggtoda3_direct/last.pt
  split: test
  protocol: vda
  rgb_root: /public/home/2024141520249/Documents/datasets/vggtodistilldata/scared
  frame_source: auto
  gt_root: /public/home/2024141520249/Documents/datasets/vggtodistilldata/scared
  gt_relative_directory: data/depth
  gt_depth_channel: 0
  require_all_gt: true
  amp: true
  output: ./outputs/vggtoda3_direct/evaluation_test_vda.json

endo3r_evaluation:
  checkpoint: ./outputs/vggtoda3_direct/last.pt
  split: test
  protocol: endo3r
  rgb_root: /public/home/2024141520249/Documents/datasets/vggtodistilldata/scared
  frame_source: auto
  gt_root: /public/home/2024141520249/Documents/datasets/vggtodistilldata/scared
  gt_relative_directory: data/depth
  gt_depth_channel: 0
  require_all_gt: true
  amp: true
  output: ./outputs/vggtoda3_direct/evaluation_test_endo3r.json

da3_small_baseline_vda_evaluation:
  split: test
  protocol: vda
  rgb_root: /public/home/2024141520249/Documents/datasets/vggtodistilldata/scared
  frame_source: auto
  gt_root: /public/home/2024141520249/Documents/datasets/vggtodistilldata/scared
  gt_relative_directory: data/depth
  gt_depth_channel: 0
  require_all_gt: true
  amp: true
  output: ./outputs/da3_small_baseline/evaluation_scared_8_9_vda.json

da3_small_baseline_endo3r_evaluation:
  split: test
  protocol: endo3r
  rgb_root: /public/home/2024141520249/Documents/datasets/vggtodistilldata/scared
  frame_source: auto
  gt_root: /public/home/2024141520249/Documents/datasets/vggtodistilldata/scared
  gt_relative_directory: data/depth
  gt_depth_channel: 0
  require_all_gt: true
  amp: true
  output: ./outputs/da3_small_baseline/evaluation_scared_8_9_endo3r.json

visualization:
  output_dir: ./outputs/vggtoda3_direct/visualization
  min_depth: 0.1
  max_depth: 10.0
  adaptive_percentiles: [5.0, 95.0]
  point_stride: 4
