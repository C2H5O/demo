# Experiment B keeps baseline pseudo-label cache supervision and obtains only
# the frozen Teacher attention Q/K online during each training step.
base_config: vggtoda3.yaml

experiment:
  name: vggtoda3_attention_distill
  hypothesis: >-
    Same-clip frozen VGGT-Omega pseudo-label supervision plus cross-frame
    attention-relation distillation improves DA3-Small endoscopic geometry.

teacher:
  raw_cache_root: /public/home/2024141520249/Documents/Projects/vggtofast3r/data/teacher_cache_crossclip_base_raw_448x560
  save_attention: false

attention_distill:
  enabled: true
  teacher_source: online
  online_teacher_batch_size: 1
  teacher_output_dtype: float16
  weight: 0.1

# Native 1024x1280 Teacher RGB is decoded online. Use batch 4 and avoid worker
# prefetch to bound host/GPU memory.
dataloader:
  batch_size: 4
  num_workers: 0
  pin_memory: false
  persistent_workers: false

training:
  output_dir: ./outputs/vggtoda3_attention_distill
