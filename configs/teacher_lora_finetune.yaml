experiment:
  name: vggtomega_lora_teacher_finetune
  seed: 42
  output_dir: ./outputs/teacher_lora_endodac_lora

device: cuda

dataset:
  root: /public/home/2024141520249/Documents/Projects/vggt_omega_distill/data/scared
  train_manifest_path: null
  test_manifest_path: null
  frame_source: auto
  clip_length: 8
  sample_stride: 1
  window_stride: 4
  drop_incomplete_clip: false
  image_height: 448
  image_width: 560
  resize_mode: resize
  normalize_mode: imagenet
  highlight:
    enabled: true
    absolute_threshold: 250.0
    candidate_threshold: 230.0
    relative_threshold: 0.95
    minimum_component_size: 5000
    keep_components: smaller
    dilation_radius: 2
    median_kernel: 31
    inpaint_blur_sigma: 8.0
    decay_window_size: 10
    decay_coefficient: 20.0

dataloader:
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: false

teacher:
  pretrained_checkpoint: ./checkpoints/vggt_omega/vggt_omega_1b_512.pt
  freeze_backbone: true
  freeze_heads: true
  lora_checkpoint: null
  min_depth: 0.1
  max_depth: 150.0
  lora:
    enabled: true
    type: lora
    rank: 4
    alpha: 1
    dropout: 0.0
    target: mlp
    target_layers: all

self_supervised_loss:
  photometric_weight: 1.0
  geometry_weight: 0.1
  highlight_weight: 0.01
  smoothness_weight: 0.01
  inpaint_consistency_weight: 0.1
  ssim_weight: 0.85
  auto_mask: true
  dynamic_weighting: true
  minimum_reprojection: true
  mask_highlights: true
  light_alignment: true
  light_mu: 3.069096
  light_gamma: 2.2
  light_minimum_cosine: 0.4
  temporal_offsets: [-1, 1]
  consistency_include_highlights: true

training:
  epochs: 20
  batch_size: 1
  learning_rate: 1.0e-5
  weight_decay: 1.0e-4
  mixed_precision: true
  gradient_accumulation_steps: 1
  gradient_clip_norm: 0.1
  warmup_steps: 200
  log_every: 10
  save_every: 1
  resume: null

runtime:
  distributed: false
  backend: nccl
