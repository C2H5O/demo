base_config: _4090_common.yaml
experiment:
  name: baseline_C_attention-distill
  baseline_id: C
  training_required: true
  implementation_status: ready_for_server_dry_run
dataset:
  clip_length: 32
  sample_stride: 2
teacher:
  mode: full_online
  use_cache: false
  raw_cache_root: null
  cache_checkpoint_identity: null
  frozen: true
  freeze_backbone: true
  freeze_heads: true
  input_height: 1024
  input_width: 1280
attention_distill:
  enabled: true
  weight: 0.1
loss:
  highlight_mode: legacy
  highlight_cone_full_angle_degrees: 10.0
  highlight_softness: 0.0005
training:
  epochs: 3
  output_dir: ./outputs/baseline_C_online32_s2_3ep
  resume: null
vda_evaluation:
  checkpoint: ./outputs/baseline_C/last.pt
  output: ./outputs/baseline_C/evaluation_test.json
visualization:
  output_dir: ./outputs/baseline_C/visualization
