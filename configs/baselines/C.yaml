base_config: _4090_common.yaml
experiment:
  name: baseline_C_attention-distill
  baseline_id: C
  training_required: true
  implementation_status: ready_for_server_dry_run
dataset:
  clip_length: 32
  sample_stride: 2
  window_stride: 8
teacher:
  mode: full_online
  use_cache: false
  raw_cache_root: null
  cache_checkpoint_identity: null
  frozen: true
  freeze_backbone: true
  freeze_heads: true
  input_height: 512
  input_width: 640
attention_distill:
  enabled: true
  weight: 0.1
  teacher_source: online
  pair_chunk_size: 2
  teacher_probability_outside_checkpoint: true
loss:
  highlight_mode: legacy
  highlight_cone_full_angle_degrees: 10.0
  highlight_softness: 0.0005
training:
  epochs: 3
  output_dir: ./outputs/baseline_C_online32_s2_3ep_t512x640
  resume: null
inference:
  image_height: 448
  image_width: 560
vda_evaluation:
  evaluation_height: 224
  evaluation_width: 280
  tae:
    enabled: false
  checkpoint: ./outputs/baseline_C_online32_s2_3ep_t512x640/last.pt
  output: ./outputs/baseline_C_online32_s2_3ep_t512x640/evaluation_test.json
visualization:
  output_dir: ./outputs/baseline_C_online32_s2_3ep_t512x640/visualization
