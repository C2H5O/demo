base_config: _4090_common.yaml

experiment:
  name: baseline_H_QG_K20
  baseline_id: H
  source_weights_branch: codex/baseline-J
  training_required: false
  implementation_status: implemented_runtime_validation_pending

training:
  output_dir: ./outputs/baseline_H
  resume: null

vda_evaluation:
  # Same final Student as Baseline J. The evaluator reuses a matching sibling
  # ours.pt or auto-merges this immutable training checkpoint when needed.
  checkpoint: /public/home/2024141520249/Documents/Projects/vggtoda3/outputs/baseline_J/last.pt
  # Match the existing Baseline-J Dense comparison grid without changing the
  # Student's 448x560 model input or its native prediction resolution.
  evaluation_height: 256
  evaluation_width: 320
  output: ./outputs/baseline_H/evaluation_qg_k20_test.json
  tae:
    enabled: false

visualization:
  output_dir: ./outputs/baseline_H/visualization

inference:
  acceleration: query_group_kv
  source_checkpoint: /public/home/2024141520249/Documents/Projects/vggtoda3/outputs/baseline_J/last.pt

kv_sampling:
  enabled: true
  method: query_group
  query_group_size: 8
  kv_frames: 20
  provider_selection: temporal_uniform
  preserve_vda_history: true
  keep_all_special_tokens: true
  apply_layers: null
  batched_sdpa: true
  diagnostics: false
  debug: false
  debug_max_windows: 3
  profile_attention: false
