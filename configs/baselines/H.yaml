base_config: _4090_common.yaml

experiment:
  name: baseline_H_fixed_global_50
  baseline_id: H
  source_weights_branch: codex/baseline-J
  source_weights_project: vggtoda3-baseline-J
  training_required: false
  implementation_status: implemented_runtime_validation_pending

training:
  output_dir: ./outputs/baseline_H
  resume: null

vda_evaluation:
  # Selected Baseline-J epoch-15 Student. The evaluator reuses a matching sibling
  # ours.pt or auto-merges this immutable training checkpoint when needed.
  checkpoint: /public/home/2024141520249/Documents/Projects/vggtoda3-baseline-J/outputs/baseline_J/epoch_0015.pt
  evaluation_height: 224
  evaluation_width: 280
  output: ./outputs/baseline_H/evaluation_fixed_global_50_test.json
  tae:
    enabled: false

visualization:
  output_dir: ./outputs/baseline_H/visualization

inference:
  acceleration: fixed_global_kv
  image_height: 448
  image_width: 560
  source_checkpoint: /public/home/2024141520249/Documents/Projects/vggtoda3-baseline-J/outputs/baseline_J/epoch_0015.pt

kv_sampling:
  enabled: true
  method: fixed_global_kv
  provider_policy: fixed_sequence_global
  persistent_kv_cache: true
  anchor_selection: fps_diversity
  global_anchor_bank:
    anchor_count: 50
    descriptor: da3_dino_pool
    selection: fps_diversity
    deterministic_seed: first_valid_frame
  spatial_sampling:
    block5: {global_stride: 2}
    block7: {global_stride: 2}
    block9: {global_stride: 2}
    block11: {global_stride: 1}
  special_tokens:
    keep_all: true
  diagnostics:
    print_once_per_sequence: true
  debug: false
  debug_max_windows: 3
  profile_attention: false
