# C weights are the feature/attention-distillation run in the server's vggtoda3 project.
# Keep C weights; H uses temporal providers plus layer-aware spatial patch KV.
base_config: G.yaml
experiment:
  name: baseline_H_C-two-level-role-layer-spatial-kv
  baseline_id: H
  source_weights_branch: feature/attention-distillation
  source_weights_project: vggtoda3
  training_required: false
  implementation_status: implemented_runtime_validation_pending
# Preserve C's historical loss configuration as provenance only; no loss runs.
loss:
  highlight_mode: legacy
training:
  output_dir: ./outputs/baseline_H
  resume: null
vda_evaluation:
  checkpoint: /public/home/2024141520249/Documents/Projects/vggtoda3/outputs/baseline_C/last.pt
  output: ./outputs/baseline_H/evaluation_test.json
visualization:
  output_dir: ./outputs/baseline_H/visualization
inference:
  acceleration: role_layer_spatial_kv
  source_checkpoint: /public/home/2024141520249/Documents/Projects/vggtoda3/outputs/baseline_C/last.pt
kv_sampling:
  enabled: true
  method: role_layer_spatial_kv
  # Provider-frame retention for a standard 32-frame later window: 24 / 32.
  retention_ratio: 0.75
  vda_role:
    key_frames: 2
    overlap_frames: 8
    new_frames: 22
    selected_new_frames: 14
  new_frame_selection:
    method: temporal_bucket_highlight
    num_buckets: 7
    keep_per_bucket: 2
    score: lightweight_highlight
    tie_break: frame_index
  first_window:
    method: bucket_highlight
    num_frames: 16
    num_buckets: 16
  # Batched Torch proxy on inference RGB; not PC-Depth segmentation.
  lightweight_highlight:
    brightness_threshold: 0.90
    saturation_threshold: 0.20
    downsample_factor: 4
  spatial_sampling:
    enabled: true
    # These are real indices in the 12-block DA3-Small encoder. Its global
    # attention blocks are 5, 7, 9, and 11.
    early_layers:
      start: 0
      end: 5
      key_stride: 1
      overlap_stride: 2
      new_stride: 2
    late_layers:
      start: 6
      end: 11
      key_stride: 1
      overlap_stride: 1
      new_stride: 1
  special_tokens:
    keep_all: true
  diagnostics:
    print_once_per_sequence: true
