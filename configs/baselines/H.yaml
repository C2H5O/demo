# C weights are the feature/attention-distillation run in the server's vggtoda3 project.
# Keep C weights; H uses full history plus grouped lightweight-highlight KV.
base_config: G.yaml
experiment:
  name: baseline_H_C-prefix14keep2-recent8-first16-later20kv
  baseline_id: H
  source_weights_branch: feature/attention-distillation
  source_weights_project: vggtoda3
  training_required: false
  implementation_status: implemented_runtime_validation_pending
# Preserve C's historical loss configuration as provenance only; no loss runs.
loss:
  highlight_mode: legacy
training:
  output_dir: ./outputs/baseline_H
  resume: null
vda_evaluation:
  checkpoint: /public/home/2024141520249/Documents/Projects/vggtoda3/outputs/vggtoda3_attention_distill/last.pt
  output: ./outputs/baseline_H/evaluation_test.json
visualization:
  output_dir: ./outputs/baseline_H/visualization
inference:
  acceleration: vda_role_bucket_highlight
  source_checkpoint: /public/home/2024141520249/Documents/Projects/vggtoda3/outputs/vggtoda3_attention_distill/last.pt
kv_sampling:
  enabled: true
  method: vda_role_bucket_highlight
  # Standard later-window budget; the first-window budget remains explicitly 16.
  retention_ratio: 0.625
  vda_role:
    key_frames: 2
    overlap_frames: 8
    new_frames: 10
  bucket_highlight:
    num_buckets: 2
    keep_policy: prefix_recent
    prefix_frames: 14
    prefix_keep: 2
    recent_frames: 8
  first_window:
    method: bucket_highlight
    num_frames: 16
    num_buckets: 16
  # Batched Torch proxy on inference RGB; not PC-Depth segmentation.
  lightweight_highlight:
    brightness_threshold: 0.90
    saturation_threshold: 0.20
    downsample_factor: 4
