base_config: _kv_sampling.yaml
experiment:
  name: baseline_F_spark3r-fixed-stride
  baseline_id: F
  training_required: false
  implementation_status: implemented_runtime_validation_pending
# Same E checkpoint as G; this is a fixed-stride control, not full Spark3R.
attention_distill:
  enabled: true
  weight: 0.1
loss:
  highlight_mode: angular_soft_margin
  highlight_cone_full_angle_degrees: 10.0
  highlight_softness: 0.0005
training:
  output_dir: ./outputs/baseline_F
  resume: null
vda_evaluation:
  checkpoint: ./outputs/baseline_E/last.pt
  output: ./outputs/baseline_F/evaluation_test.json
visualization:
  output_dir: ./outputs/baseline_F/visualization
inference:
  acceleration: spark3r_reference
  implementation_status: implemented_runtime_validation_pending
  source_checkpoint: ./outputs/baseline_E/last.pt
kv_sampling:
  enabled: true
  method: spark3r_fixed_stride
