base_config: _4090_common.yaml
experiment:
  name: baseline_D_pseudo-soft-highlight
  baseline_id: D
  training_required: true
  implementation_status: ready_for_server_dry_run
dataset:
  clip_length: 32
  sample_stride: 2
  window_stride: 8
teacher:
  mode: full_online
  use_cache: false
  raw_cache_root: null
  cache_checkpoint_identity: null
  frozen: true
  freeze_backbone: true
  freeze_heads: true
  input_height: 512
  input_width: 640
attention_distill:
  enabled: false
  weight: 0.0
loss:
  highlight_mode: angular_soft_margin
  highlight_cone_full_angle_degrees: 10.0
  highlight_softness: 0.0005
training:
  epochs: 3
  output_dir: ./outputs/baseline_D_online32_s2_3ep_t512x640
  resume: null
vda_evaluation:
  checkpoint: ./outputs/baseline_D_online32_s2_3ep_t512x640/last.pt
  output: ./outputs/baseline_D_online32_s2_3ep_t512x640/evaluation_test.json
visualization:
  output_dir: ./outputs/baseline_D_online32_s2_3ep_t512x640/visualization
