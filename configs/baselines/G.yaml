base_config: _kv_sampling.yaml
experiment:
  name: baseline_G_vda-role-kv
  baseline_id: G
  training_required: false
  implementation_status: implemented_runtime_validation_pending
# Historical E checkpoint training configuration; never used as an inference objective.
attention_distill:
  enabled: true
  weight: 0.1
loss:
  highlight_mode: angular_soft_margin
  highlight_cone_full_angle_degrees: 10.0
  highlight_softness: 0.0005
training:
  output_dir: ./outputs/baseline_G
  resume: null
vda_evaluation:
  checkpoint: ./outputs/baseline_E/last.pt
  output: ./outputs/baseline_G/evaluation_test.json
visualization:
  output_dir: ./outputs/baseline_G/visualization
inference:
  acceleration: vda_role
  implementation_status: implemented_runtime_validation_pending
  source_checkpoint: ./outputs/baseline_E/last.pt
kv_sampling:
  enabled: true
  method: vda_role
