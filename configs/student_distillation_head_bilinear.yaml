experiment:
  name: vggtomega_to_distill3r_bilinear_head
  seed: 42

seed: 42
device: cuda

dataset:
  name: scared
  root: /public/home/2024141520249/Documents/Projects/vggt_omega_distill/data/scared
  train_manifest_path: null
  test_manifest_path: null
  frame_source: auto
  clip_length: 8
  sample_stride: 1
  window_stride: 4
  drop_incomplete_clip: false
  image_height: 448
  image_width: 560
  resize_mode: resize
  normalize_mode: zero_one
  ground_truth:
    enabled: true
    required: true
    directory_keys: [depth_directory, scene_points_directory]
    relative_directories:
      - data/depth
      - data/scene_points
    scale: 0.001
    channel: 0

teacher:
  pretrained_checkpoint: ./checkpoints/vggt_omega/vggt_omega_1b_512.pt
  freeze_backbone: true
  freeze_heads: true
  lora_checkpoint: /public/home/2024141520249/Documents/Projects/vggtomega_lora_distill/outputs/teacher_lora_endodac_lora/last.pt
  cache_root: /public/home/2024141520249/Documents/Projects/vggtomega_lora_distill/data/teacher_cache_endodac_lora_448x560
  frozen: true
  image_resolution: 560
  preprocess_mode: max_size
  image_height: 448
  image_width: 560
  min_depth: 0.1
  max_depth: 150.0
  lora:
    enabled: true
    type: lora
    rank: 4
    alpha: 1
    dropout: 0.0
    target: mlp
    target_layers: all

student:
  image_height: 448
  image_width: 560
  img_size: 560
  patch_size: 14
  embed_dim: 384
  encoder_depth: 12
  encoder_heads: 6
  decoder_depth: 6
  decoder_heads: 6
  decoder_attention_implementation: flash_attention
  encoder_type: dune
  max_views: 16
  max_parallel_views_for_head: 8
  landscape_only: true
  with_local_head: true
  conf_mode: [sigmoid, 0.0, 1.0]
  load_pretrained: true
  # Formal control: both backbones stay fixed and in eval mode.
  freeze_encoder: true
  freeze_decoder: true
  # The only architecture change: branch0 ConvTranspose4 -> bilinear x4.
  dpt_branch0_resize: bilinear
  pretrained_checkpoint: ./checkpoints/dune/dune_vitsmall14_448.pth
  use_local_dune_submodule: true

loss:
  lambda_point: 1.0
  lambda_geo: 0.25
  lambda_smooth: 0.03
  lambda_conf: 0.1
  lambda_supervised_depth: 0.1
  lambda_global: 1.0
  lambda_local: 1.0
  alpha_dist: 1.0
  alpha_normal: 0.5
  charbonnier_eps: 0.001
  confidence_floor: 0.02
  point_scale_mode: avg_distance
  min_depth: 0.1
  max_depth: 150.0
  normalize_mode: zero_one
  supervised_depth_scale_alignment: median
  supervised_depth_loss: log_l1
  supervised_depth_min_depth: 0.0001
  supervised_depth_max_depth: 100.0

dataloader:
  batch_size: 1
  num_workers: 4
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2
  drop_last: false

training:
  epochs: 20
  learning_rate: 1.0e-5
  min_learning_rate: 1.0e-6
  weight_decay: 0.05
  warmup_steps: 0
  gradient_accumulation_steps: 32
  gradient_clip_norm: 1.0
  amp: true
  amp_dtype: auto
  amp_initial_scale: 128.0
  amp_growth_interval: 2000
  log_every: 10
  validate_every: 1
  save_every: 1
  use_test_for_evaluation: true
  # Load model tensors only. Old optimizer/scheduler/scaler state is ignored.
  initial_checkpoint: ./outputs/student_distill3r_448x560/last.pt
  output_dir: ./outputs/student_distill3r_448x560_bilinear_head
  resume: null

evaluation:
  # Retained optional Endo3R evaluation; it is not the default test protocol.
  checkpoint: ./outputs/student_distill3r_448x560_bilinear_head/last.pt
  split: test
  protocol: endo3r
  frame_source: auto
  gt_relative_directory: data/depth
  gt_depth_channel: 0
  require_all_gt: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  amp: true
  output: ./outputs/student_distill3r_448x560_bilinear_head/evaluation_test_endo3r.json

# Primary test protocol for this experiment. This reuses evaluate_vda.py and
# leaves the upstream VDA scale/shift alignment and metrics unchanged.
vda_evaluation:
  checkpoint: ./outputs/student_distill3r_448x560_bilinear_head/last.pt
  split: test
  protocol: video-depth-anything-depth
  frame_source: auto
  gt_relative_directory: data/depth
  gt_depth_channel: 0
  require_all_gt: true
  pin_memory: true
  amp: true
  output: ./outputs/student_distill3r_448x560_bilinear_head/evaluation_test_vda.json
